name: Publish Android update

on:
  push:
    branches: [codex/publish-pedometer-updates]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shagritm-production-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the production branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/codex/publish-pedometer-updates' ]]; then
            echo 'Production updates must run from codex/publish-pedometer-updates.' >&2
            exit 1
          fi

      - name: Check out source and native release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and publish the Android update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        shell: bash
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo 'Configure the EXPO_TOKEN repository Actions secret before publishing.' >&2
            exit 1
          fi
          npm run update:production -- --message "Automatic update $GITHUB_SHA"
